name: CI

# 只在 PR 上验证：squash/merge 合入后的树与 PR head 一致，push 再跑一遍是重复；
# main 的生产部署由 deploy-main.yml 独立触发，不依赖本工作流。
on:
  pull_request:

permissions:
  contents: read

# 同一 PR 连续推送时取消过时的验证，节省额度。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 静态验证：typecheck + 覆盖率门禁 + UI + build（无需浏览器）。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # E2E 按 spec 分片并行：每个 job 独立起生产服务，软件渲染下互不抢 CPU。
  e2e:
    runs-on: ubuntu-latest
    # WebGL 走软件渲染，单个用例可能远慢于本地。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [party, board-games, monster-car]
    name: e2e (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 缓存 Playwright 浏览器：版本由 pnpm-lock 锁定，命中时跳过 ~150MB 下载。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/${{ matrix.suite }}.spec.ts
